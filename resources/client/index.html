<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>CarDisplay</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Image element that receives the MJPEG stream -->
    <img id="screen" alt="" />

    <!-- Fullscreen prompt (shown once after first frame arrives) -->
    <div id="fs-prompt">
      <button id="fs-btn">⛶ Tap to go fullscreen</button>
    </div>

    <!-- Loading / connecting overlay -->
    <div id="loader">
      <div class="loader-logo">
        <div class="loader-logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="2" y="3" width="20" height="14" rx="2" stroke="white" stroke-width="2"/>
            <path d="M8 21h8M12 17v4" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="loader-logo-text">CarDisplay</span>
      </div>

      <div class="spinner"></div>

      <p id="loader-status" class="loader-status">Connecting…</p>
      <p class="loader-hint">Make sure you're on the same network</p>
    </div>

    <!-- Live status badge (top-right, fades after connect) -->
    <div id="status-overlay">
      <div class="status-dot"></div>
      <span id="status-text">Connected</span>
    </div>

    <!-- Error overlay -->
    <div id="error-overlay">
      <div class="error-icon">⚡</div>
      <p class="error-title">Connection Failed</p>
      <p id="error-msg" class="error-msg">
        Could not connect to CarDisplay. Make sure the app is running and
        you are on the same network.
      </p>
      <button id="retry-btn" class="retry-btn">Retry</button>
    </div>
  </div>

  <script src="/client.js"></script>
</body>
</html>
