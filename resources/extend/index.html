<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Extended Display</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0d0d0d;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background-image: radial-gradient(circle, #1c1c1c 1px, transparent 1px);
      background-size: 28px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      user-select: none;
    }
    .badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(99,102,241,0.1);
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: 20px;
      padding: 6px 16px;
      color: #6366f1;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #6366f1;
      animation: pulse 2s ease-in-out infinite;
    }
    .hint {
      font-size: 12px;
      color: #2a2a2a;
      text-align: center;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="badge">
    <span class="dot"></span>
    Extended Display
  </div>
  <p class="hint">Drag windows here · Being streamed to connected devices</p>
</body>
</html>
